name: Update Discord updater post

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  LOGO: https://www.midnightessentials.me/favicon.png
  PAGE: https://www.midnightessentials.me/#updater
  IMAGE: https://raw.githubusercontent.com/NotOpti/MidnightEssentials-Updater/main/assets/discord-preview.png
  ID_FILE: .github/discord-message-id

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Post new updater message and delete the old one
        env:
          WEBHOOK: ${{ secrets.UPDATER_WEBHOOK }}
          OLD_ID_VAR: ${{ vars.UPDATER_MESSAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac

          jq -n --arg v "$VERSION" --arg logo "$LOGO" --arg page "$PAGE" --arg img "$IMAGE" '{
            username: "MidnightEssentials",
            avatar_url: $logo,
            embeds: [{
              title: ("MidnightEssentials Updater " + $v),
              url: $page,
              description: "Installs MidnightEssentials and keeps it up to date in one click. Your settings and other addons are never touched.\n\n**How to use** · Download, extract, open `MidnightEssentialsUpdater.exe`, pick your World of Warcraft folder and click **Install** or **Update**.\n**Windows warning?** · Click **More info**, then **Run anyway**.",
              color: 10980346,
              image: { url: $img }
            }],
            components: [{ type: 1, components: [
              { type: 2, style: 5, label: "Download", url: $page }
            ]}]
          }' > payload.json

          OLD_ID=""
          [ -f "$ID_FILE" ] && OLD_ID=$(cat "$ID_FILE")
          [ -z "$OLD_ID" ] && OLD_ID="$OLD_ID_VAR"

          RESP=$(curl -sS --fail-with-body -H "Content-Type: application/json" -d @payload.json "$WEBHOOK?wait=true&with_components=true")
          NEW_ID=$(echo "$RESP" | jq -r .id)

          if [ -n "$OLD_ID" ]; then
            curl -sS -X DELETE "$WEBHOOK/messages/$OLD_ID" || true
          fi

          echo "$NEW_ID" > "$ID_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$ID_FILE"
          git commit -m "Update Discord message ID [skip ci]"
          git push
          echo "### Posted new updater message ($VERSION), ID: \`$NEW_ID\`" >> "$GITHUB_STEP_SUMMARY"
