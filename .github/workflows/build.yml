name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MidnightEssentialsUpdater.exe
        shell: cmd
        run: build.cmd

      - name: Upload build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MidnightEssentialsUpdater
          path: dist/MidnightEssentialsUpdater.exe

      # The SignPath signing step goes here once the project is approved.

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MidnightEssentialsUpdater.exe --title "$GITHUB_REF_NAME" --notes "MidnightEssentials Updater $GITHUB_REF_NAME"
